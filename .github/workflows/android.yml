name: Build Android app

on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Capacitor and sync the Android project
        working-directory: android-app
        run: |
          npm ci
          npm run sync

      - name: Build the APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Fretline.apk"

      - name: Publish to the "android-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest Fretline.apk \
            --title "Fretline for Android (build ${{ github.run_number }})" \
            --notes "Download **Fretline.apk** below and open it on your Android phone to install or update. The app loads the latest Fretline from GitHub Pages, so most updates arrive without reinstalling." \
            --target "${{ github.sha }}"
